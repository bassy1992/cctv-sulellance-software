openapi: 3.0.3
info:
  title: Surveillance VMS API
  version: 1.0.0
  description: API documentation for the CCTV surveillance management backend.
paths:
  /api/cameras/:
    get:
      operationId: api_cameras_list
      description: Return plain list (not paginated dict) to match frontend Camera[]
        expectation.
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
