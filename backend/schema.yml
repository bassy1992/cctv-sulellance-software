components:
  schemas:
    Camera:
      type: object
      description: Serializer for Camera model with computed fields for frontend compatibility.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Human-friendly camera name
          maxLength: 100
        ip_address:
          type: string
          description: Camera IP address
        port:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: RTSP port
        onvif_port:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: ONVIF port for PTZ control
        username:
          type: string
          description: Camera authentication username
          maxLength: 50
        hasPassword:
          type: boolean
          description: Check if camera has a password set.
          readOnly: true
        rtsp_stream_path:
          type: string
          description: Main stream path (e.g., /stream1)
          maxLength: 200
        sub_stream_path:
          type: string
          description: Sub stream path (e.g., /stream2)
          maxLength: 200
        status:
          $ref: '#/components/schemas/CameraStatusEnum'
        is_recording:
          type: boolean
          description: Currently recording
        is_enabled:
          type: boolean
          description: Camera is enabled for monitoring
        recording_enabled:
          type: boolean
          description: Recording is enabled for this camera
        resolution:
          type: string
          description: Current video resolution
          maxLength: 50
        fps:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Frames per second
        bitrate_kbps:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Video bitrate in kbps
        model:
          type: string
          description: Camera model
          maxLength: 100
        location:
          type: string
          description: Physical location description
          maxLength: 200
        pan_tilt_supported:
          type: boolean
          description: Camera supports pan/tilt control
        ptzCurrentPosition:
          type: object
          additionalProperties: {}
          description: Get current PTZ position.
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          description: Last successful communication
        error_reason:
          type: string
          nullable: true
          description: Last error message
        mac_address:
          type: string
          nullable: true
          description: MAC address
          maxLength: 17
        firmware_version:
          type: string
          nullable: true
          description: Camera firmware version
          maxLength: 100
        liveHlsUrl:
          type: string
          description: Generate HLS stream URL for live viewing.
          readOnly: true
      required:
      - hasPassword
      - id
      - ip_address
      - last_seen
      - liveHlsUrl
      - location
      - name
      - ptzCurrentPosition
      - username
    CameraForm:
      type: object
      description: Serializer for camera form data (create/update operations).
      properties:
        name:
          type: string
          description: Human-friendly camera name
          maxLength: 100
        ip_address:
          type: string
          description: Camera IP address
        port:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: RTSP port
        onvif_port:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: ONVIF port for PTZ control
        username:
          type: string
          description: Camera authentication username
          maxLength: 50
        password:
          type: string
          writeOnly: true
        rtsp_stream_path:
          type: string
          description: Main stream path (e.g., /stream1)
          maxLength: 200
        sub_stream_path:
          type: string
          description: Sub stream path (e.g., /stream2)
          maxLength: 200
        location:
          type: string
        recording_enabled:
          type: boolean
          description: Recording is enabled for this camera
        pan_tilt_supported:
          type: boolean
          description: Camera supports pan/tilt control
      required:
      - ip_address
      - name
      - username
    CameraStatusEnum:
      enum:
      - ONLINE
      - OFFLINE
      - CONNECTING
      - ERROR
      type: string
      description: |-
        * `ONLINE` - Online
        * `OFFLINE` - Offline
        * `CONNECTING` - Connecting
        * `ERROR` - Error
    PaginatedRecordingList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Recording'
    PatchedCameraForm:
      type: object
      description: Serializer for camera form data (create/update operations).
      properties:
        name:
          type: string
          description: Human-friendly camera name
          maxLength: 100
        ip_address:
          type: string
          description: Camera IP address
        port:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: RTSP port
        onvif_port:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: ONVIF port for PTZ control
        username:
          type: string
          description: Camera authentication username
          maxLength: 50
        password:
          type: string
          writeOnly: true
        rtsp_stream_path:
          type: string
          description: Main stream path (e.g., /stream1)
          maxLength: 200
        sub_stream_path:
          type: string
          description: Sub stream path (e.g., /stream2)
          maxLength: 200
        location:
          type: string
        recording_enabled:
          type: boolean
          description: Recording is enabled for this camera
        pan_tilt_supported:
          type: boolean
          description: Camera supports pan/tilt control
    PatchedSettingsUpdateRequest:
      type: object
      properties:
        settings:
          type: object
          additionalProperties: {}
    Recording:
      type: object
      description: Serializer for Recording model with computed fields for frontend
        compatibility.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        cameraId:
          type: string
          readOnly: true
        cameraName:
          type: string
          readOnly: true
        cameraLocation:
          type: string
          readOnly: true
        startTime:
          type: string
          format: date-time
          readOnly: true
        endTime:
          type: string
          format: date-time
          readOnly: true
        durationSeconds:
          type: integer
          readOnly: true
        fileSizeMB:
          type: number
          format: float
          readOnly: true
        status:
          $ref: '#/components/schemas/RecordingStatusEnum'
        triggerType:
          type: string
          readOnly: true
        videoUrl:
          type: string
          readOnly: true
        thumbnailUrl:
          type: string
          readOnly: true
        storageFilePath:
          type: string
          readOnly: true
        resolution:
          type: string
          description: Video resolution
          maxLength: 50
        fps:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Frames per second
        bitrateKbps:
          type: integer
          readOnly: true
        fileAvailable:
          type: boolean
          readOnly: true
      required:
      - bitrateKbps
      - cameraId
      - cameraLocation
      - cameraName
      - durationSeconds
      - endTime
      - fileAvailable
      - fileSizeMB
      - fps
      - id
      - resolution
      - startTime
      - storageFilePath
      - thumbnailUrl
      - triggerType
      - videoUrl
    RecordingStatusEnum:
      enum:
      - COMPLETED
      - RECORDING
      - FAILED
      type: string
      description: |-
        * `COMPLETED` - Completed
        * `RECORDING` - Recording
        * `FAILED` - Failed
    ResetSettingsResponse:
      type: object
      properties:
        success:
          type: boolean
        settings:
          type: object
          additionalProperties: {}
        error:
          type: string
          nullable: true
    SettingsUpdateRequest:
      type: object
      properties:
        settings:
          type: object
          additionalProperties: {}
    SettingsUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        settings:
          type: object
          additionalProperties: {}
        error:
          type: string
          nullable: true
    StorageRetentionInput:
      type: object
      properties:
        retentionDays:
          type: integer
          minimum: 1
    SurveillanceEvent:
      type: object
      properties:
        id:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        camera_id:
          type: string
          nullable: true
        severity:
          type: string
          nullable: true
    SystemSettingsInput:
      type: object
      properties:
        days:
          type: integer
          default: 30
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
